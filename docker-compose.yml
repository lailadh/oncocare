services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - "8000:8000"
        environment:
            APP_NAME: OncoCare
            APP_ENV: local
            APP_DEBUG: "true"
            APP_KEY: "${APP_KEY:?Set APP_KEY in the environment before starting Docker}"
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: oncocare
            DB_USERNAME: oncocare
            DB_PASSWORD: "${DB_PASSWORD:-oncocare}"
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: oncocare
            MYSQL_USER: oncocare
            MYSQL_PASSWORD: "${DB_PASSWORD:-oncocare}"
            MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
        ports:
            - "3306:3306"
        volumes:
            - oncocare_mysql:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 5s
            timeout: 5s
            retries: 20

volumes:
    oncocare_mysql:
